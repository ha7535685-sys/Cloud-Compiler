version: '3.8'

services:
  # Sandboxed execution engine (Piston)
  piston:
    image: ghcr.io/engineer-man/piston:latest
    container_name: piston_sandbox
    restart: unless-stopped
    privileged: true
    ports:
      - "2000:2000"
    tmpfs:
      - /tmp:exec,mode=777
    pids_limit: 100
    mem_limit: 1024m
    cpu_shares: 1024

  # Backend API server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: compiler_server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - CLIENT_URL=${CLIENT_URL:-http://localhost:5173}
      - PISTON_API_URL=http://piston:2000/api/v2
      - FALLBACK_PISTON_API_URL=https://emkc.org/api/v2/piston
      - DATABASE_URL=file:/app/data/app.db
      - AI_PROVIDER=${AI_PROVIDER:-gemini}
      - AI_API_KEY=${AI_API_KEY}
      - AI_MODEL=${AI_MODEL:-gemini-1.5-flash}
    volumes:
      - server_data:/app/data
    depends_on:
      - piston

volumes:
  server_data:
